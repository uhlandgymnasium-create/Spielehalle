<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spielhalle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f3f1ff;--sf:#fff;--ln:#cfcaf0;--tx:#1d1a3f;--mu:#5b5790;--p1:#0a9f86;--p2:#b98600;--ac:#d63a6e;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132e;--sf:#221f47;--ln:#3a3670;--tx:#f1eeff;--mu:#a9a4d6;--p1:#2ee6c5;--p2:#ffd23f;--ac:#ff5d8f;--on:#0e0c22}}
:root[data-theme="dark"]{--bg:#15132e;--sf:#221f47;--ln:#3a3670;--tx:#f1eeff;--mu:#a9a4d6;--p1:#2ee6c5;--p2:#ffd23f;--ac:#ff5d8f;--on:#0e0c22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.5 "Bricolage Grotesque",system-ui,sans-serif}
[hidden]{display:none!important}
main{max-width:860px;margin:0 auto;padding:2rem 1.25rem 3rem}
h1{font-weight:800;font-size:clamp(2.6rem,12vw,5rem);line-height:.95;margin:0 0 .75rem;letter-spacing:-.03em}
.lead{color:var(--mu);max-width:44ch;margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.card{display:flex;flex-direction:column;gap:.35rem;text-align:left;font:inherit;color:inherit;background:var(--sf);border:2px solid var(--ln);border-radius:22px;padding:1rem 1rem 1.25rem;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.card b{font-size:1.35rem;font-weight:800}
.card span{color:var(--mu)}
.card .gl{display:grid;place-items:center;height:84px;margin-bottom:.5rem;border-radius:12px;background:var(--c);font-size:2.6rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:1rem}
.bar h2{font-size:1.8rem;font-weight:800;margin:0;flex:1 1 auto}
.btn,.seg button{font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:.45rem 1.1rem;cursor:pointer;display:inline-block}
.seg{display:inline-flex;border:2px solid var(--ln);border-radius:999px;overflow:hidden;background:var(--sf)}
.seg button{border:0;border-radius:0}
.seg [aria-pressed="true"]{background:var(--p1);color:var(--on);font-weight:800}
.in{font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--ln);border-radius:999px;padding:.45rem 1rem;width:100%}
.ta{font:.8rem/1.3 monospace;color:var(--tx);background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:.5rem;width:100%;resize:vertical}
#st{font-weight:800;font-size:1.2rem;min-height:2rem;margin:.5rem 0}
#hint{color:var(--mu);max-width:60ch;margin-top:1rem}
.stage{display:flex;justify-content:center}
.qz{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(100%,520px)}
.flag{font-size:clamp(5rem,28vw,8rem);line-height:1.1}
.q{font-size:1.4rem;font-weight:800;text-align:center;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%}
.opt{font:inherit;color:var(--tx);background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:.8rem .5rem;cursor:pointer}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--p1);background:var(--p1);color:var(--on);font-weight:800}
.opt.wrong{border-color:var(--ac);text-decoration:line-through}
.mm{display:grid;gap:1rem;width:100%;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
.ctl{display:flex;flex-direction:column;gap:.6rem}
.tp{display:flex;gap:.4rem;flex-wrap:wrap}
canvas{width:100%;max-width:var(--w,500px);height:auto;border-radius:16px;border:2px solid var(--ln)}
.btn:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
<section id="home">
<h1>Spielhalle</h1>
<p class="lead">Zwei Quizspiele und ein Memegenerator. Die Quiz laufen allein, zu zweit am selben Gerät oder online.</p>
<div class="grid" id="grid"></div>
</section>
<section id="play" hidden>
<div class="bar">
<button class="btn" id="back">Zurück</button>
<h2 id="t"></h2>
<div class="seg" id="sg" role="group" aria-label="Spielmodus">
<button data-m="1" aria-pressed="true">Allein</button>
<button data-m="2" aria-pressed="false">Zu zweit</button>
<button data-m="3" aria-pressed="false">Online</button>
</div>
<button class="btn" id="re">Neu starten</button>
</div>
<div id="net" hidden><div class="bar"><button class="btn" id="mk">Raum erstellen</button><button class="btn" id="jn">Raum beitreten</button></div><div id="pp" hidden><div class="bar"><label for="code" id="s1"></label><input class="in" id="code" maxlength="12" autocomplete="off" spellcheck="false" style="width:10ch"><button class="btn" id="b1">Beitreten</button></div></div></div>
<p id="st" aria-live="polite"></p>
<div class="stage" id="stage"></div>
<p id="hint"></p>
</section>
</main>

const N=Object.fromEntries("DE:Deutschland,FR:Frankreich,IT:Italien,ES:Spanien,PT:Portugal,NL:Niederlande,BE:Belgien,CH:Schweiz,AT:Österreich,PL:Polen,SE:Schweden,NO:Norwegen,FI:Finnland,DK:Dänemark,IE:Irland,GB:Vereinigtes Königreich,GR:Griechenland,TR:Türkei,UA:Ukraine,CZ:Tschechien,HU:Ungarn,RO:Rumänien,US:USA,CA:Kanada,MX:Mexiko,BR:Brasilien,AR:Argentinien,CL:Chile,CO:Kolumbien,PE:Peru,CN:China,JP:Japan,KR:Südkorea,IN:Indien,TH:Thailand,VN:Vietnam,ID:Indonesien,AU:Australien,NZ:Neuseeland,ZA:Südafrika,EG:Ägypten,MA:Marokko,NG:Nigeria,KE:Kenia,SA:Saudi-Arabien,IL:Israel,IR:Iran,PK:Pakistan,CU:Kuba,IS:Island".split(",").map(s=>s.split(":")));
const has=c=>typeof c=="string"&&Object.hasOwn(N,c);
const flag=c=>String.fromCodePoint(...[...c].map(x=>127397+x.charCodeAt()));
const FLAG={max:1,
 make:()=>{const k=Object.keys(N);return shuffle(k).slice(0,10).map(c=>({c,o:shuffle([c,...shuffle(k.filter(x=>x!=c)).slice(0,3)])}))},
 ok:q=>q&&has(q.c)&&Array.isArray(q.o)&&q.o.length==4&&q.o.every(has),
 show:(q,box,done)=>{
  box.innerHTML=`<div class="flag" role="img" aria-label="Flagge">${flag(q.c)}</div><div class="opts">${q.o.map(c=>`<button class="opt" data-c="${c}">${N[c]}</button>`).join("")}</div>`;
  const bs=[...box.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.c==q.c;
   bs.forEach(x=>{x.disabled=true;if(x.dataset.c==q.c)x.classList.add("right")});
   if(!ok)b.classList.add("wrong");
   done(+ok,ok?"Richtig!":`Falsch. Das war ${N[q.c]}.`)})}};
const Q=[["Wie hoch ist der Mount Everest in Metern?",8849],["Wie viele Einwohner hat Deutschland in Millionen?",84],["Wie viele Knochen hat ein erwachsener Mensch?",206],["Wie weit ist der Mond von der Erde entfernt, in Kilometern?",384400],["Wie hoch ist der Eiffelturm in Metern?",330],["Wie viele Zähne hat ein erwachsener Mensch?",32],["Wie lang ist der Rhein in Kilometern?",1233],["Wie hoch ist das Burj Khalifa in Metern?",828],["Wie viele Länder sind Mitglied der UNO?",193],["Wie viele Tasten hat ein Klavier?",88],["Wie lang ist der Erdumfang am Äquator in Kilometern?",40075]];
const EST={max:100,
 make:()=>shuffle(Q).slice(0,8),
 ok:q=>Array.isArray(q)&&typeof q[0]=="string"&&q[0].length<200&&typeof q[1]=="number"&&q[1]>0,
 show:(q,box,done)=>{
  box.innerHTML=`<p class="q">${esc(q[0])}</p><input class="in" id="g" inputmode="decimal" autocomplete="off" aria-label="Deine Schätzung"><button class="btn" id="ok">Antwort prüfen</button>`;
  const g=box.querySelector("#g"),ok=box.querySelector("#ok");
  const go=()=>{const n=parseFloat(g.value.replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",","."));
   if(isNaN(n))return;
   const a=q[1],e=Math.abs(n-a)/a,p=Math.round(Math.max(0,100-100*e));
   g.disabled=true;ok.remove();
   done(p,`Richtig ist ${a.toLocaleString("de-DE")}. Du lagst ${Math.round(e*100)} Prozent daneben: ${p} Punkte.`)};
  ok.onclick=go;g.onkeydown=e=>{if(e.key=="Enter")go()};g.focus()}};
const G=[
{n:"Flaggenquiz",d:"Erkenne zehn Länder an ihrer Flagge.",h:"Wähle das passende Land. Zu zweit antwortet ihr abwechselnd. Online spielen beide dieselben Fragen und vergleichen am Ende die Punkte. Siehst du nur Buchstaben statt Flaggen, zeigt dein Gerät keine Flaggen-Emojis an.",f:quiz(FLAG),g:"🚩",c:"var(--p1)"},
{n:"Schätzquiz",d:"Wie hoch, wie lang, wie viele? Je näher, desto mehr Punkte.",h:"Gib deine Schätzung als Zahl ein. Pro Frage gibt es bis zu 100 Punkte. Zu zweit antwortet ihr abwechselnd. Online spielen beide dieselben Fragen.",f:quiz(EST),g:"🎯",c:"var(--p2)"},
{n:"Memegenerator",d:"Zufälliges Meme, Text drauf, speichern.",h:"Du bekommst ein zufälliges Meme. Schreibe Text oben und unten und speichere das Ergebnis. Das Meme lässt sich bis zu fünfmal gegen ein anderes tauschen.",f:meme,g:"😂",c:"var(--ac)",nm:1}];
let cur,mode=1,stop,pend;
$("#grid").innerHTML=G.map((g,i)=>`<button class="card" data-i="${i}" style="--c:${g.c}"><span class="gl">${g.g}</span><b>${g.n}</b><span>${g.d}</span></button>`).join("");
$("#grid").onclick=e=>{const b=e.target.closest(".card");if(b)open(+b.dataset.i)};
const seg=document.querySelectorAll(".seg button");
function open(i){cur=G[i];if(cur.nm)mode=1;$("#sg").hidden=!!cur.nm;$("#re").hidden=!!cur.nm;seg.forEach(x=>x.setAttribute("aria-pressed",+x.dataset.m==mode));
 $("#t").textContent=cur.n;$("#hint").textContent=cur.h;$("#home").hidden=true;$("#play").hidden=false;scrollTo(0,0);run()}
function run(code){stop&&stop();stop=0;pend&&pend.stop();pend=0;$("#stage").innerHTML="";$("#net").hidden=mode!=3;
 if(mode==3&&!code){$("#st").textContent="Erstelle einen Raum oder tritt einem bei.";$("#pp").hidden=true;return}
 stop=cur.f($("#stage"),mode,s=>$("#st").textContent=s,code)}
seg.forEach(b=>b.onclick=()=>{mode=+b.dataset.m;seg.forEach(x=>x.setAttribute("aria-pressed",x==b));run()});
$("#back").onclick=()=>{stop&&stop();stop=0;$("#play").hidden=true;$("#home").hidden=false};
$("#re").onclick=()=>stop&&stop.again?stop.again():run();

$("#mk").onclick=()=>pair(true);$("#jn").onclick=()=>pair(false);

function pair(host){
 const say=s=>$("#st").textContent=s;
 stop&&stop();stop=0;pend&&pend.stop();pend=0;$("#stage").innerHTML="";
 if(!window.Peer)return say("Die Verbindungsbibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung.");
 const s1=$("#s1"),ci=$("#code"),b1=$("#b1");$("#pp").hidden=false;
 const wrap=(c,role,peer)=>{const h=Object.create(null);let cl=()=>{};
  c.on("data",d=>{try{const m=JSON.parse(d);(h[m.t]||[]).forEach(f=>f(m.d))}catch(_){}});
  c.on("close",()=>cl());
  return{role,emit:(t,d)=>{try{c.send(JSON.stringify({t,d}))}catch(_){}},on:(t,f)=>(h[t]=h[t]||[]).push(f),onclose:f=>{cl=f},stop:()=>{try{c.close();peer.destroy()}catch(_){}}}};
 const start=(c,role,peer)=>{$("#net").hidden=true;pend=0;stop=cur.f($("#stage"),3,say,wrap(c,role,peer))};
 const fail=e=>say(e&&e.type=="peer-unavailable"?"Diesen Raum gibt es nicht. Prüfe den Code.":"Verbindung nicht möglich. Prüfe deine Internetverbindung.");
 if(host){
  const code=Math.random().toString(36).slice(2,8),peer=new Peer("spielhalle-"+code);let got=false;
  pend={stop:()=>peer.destroy()};
  s1.textContent="Dein Raum-Code:";ci.value=code;ci.readOnly=true;b1.hidden=true;
  say("Raum wird erstellt …");
  peer.on("open",()=>say(`Nenne deinem Mitspieler den Raum-Code ${code}. Das Spiel startet, sobald er beitritt.`));
  peer.on("connection",c=>{if(got){c.close();return}got=true;c.on("open",()=>start(c,0,peer))});
  peer.on("error",e=>e.type=="unavailable-id"?pair(true):fail(e));
 }else{
  s1.textContent="Raum-Code deines Mitspielers:";ci.value="";ci.readOnly=false;b1.hidden=false;
  b1.onclick=()=>{const v=ci.value.trim().toLowerCase();
   if(!/^[a-z0-9]{3,12}$/.test(v))return say("Der Code besteht aus Buchstaben und Ziffern.");
   pend&&pend.stop();const peer=new Peer();let ok=false;pend={stop:()=>peer.destroy()};say("Verbinde …");
   peer.on("error",fail);
   peer.on("open",()=>{const c=peer.connect("spielhalle-"+v);c.on("open",()=>{ok=true;start(c,1,peer)});c.on("error",fail);
    setTimeout(()=>{if(!ok&&!peer.destroyed)say("Keine Antwort vom Raum. Prüfe den Code oder versuche es erneut.")},12000)})};
 }}

function quiz(cfg){return(st,m,say,code)=>{
 let qs,i=0,p=0,sc=[0,0],net,me=-1,mine=null,other=null,dead=false;
 const box=document.createElement("div");box.className="qz";st.append(box);
 const result=()=>{if(mine==null)return;
  say(other==null?`Fertig mit ${mine} Punkten. Warte auf deinen Gegner …`:mine==other?`Unentschieden mit ${mine} Punkten!`:mine>other?`Du gewinnst mit ${mine} zu ${other} Punkten!`:`Dein Gegner gewinnt mit ${other} zu ${mine} Punkten.`)};
 const fin=()=>{box.innerHTML='<p class="q">Spiel beendet</p>';
  if(m==1)say(`Fertig! Du hast ${sc[0]} von ${qs.length*cfg.max} Punkten.`);
  else if(m==2)say(sc[0]==sc[1]?`Unentschieden mit ${sc[0]} Punkten!`:`Spieler ${sc[0]>sc[1]?1:2} gewinnt mit ${Math.max(...sc)} zu ${Math.min(...sc)} Punkten.`);
  else{mine=sc[0];net.emit("done",{s:mine});result()}};
 const ask=()=>{if(i>=qs.length)return fin();p=m==2?i%2:0;
  say(m==2?`Frage ${i+1} von ${qs.length}, Spieler ${p+1} ist dran (Stand ${sc[0]} zu ${sc[1]})`:`Frage ${i+1} von ${qs.length}, Punkte: ${sc[0]}`);
  const q=document.createElement("div");q.className="qz";box.innerHTML="";box.append(q);
  cfg.show(qs[i],q,(pts,msg)=>{sc[p]+=pts;say(msg);
   const b=document.createElement("button");b.className="btn";b.textContent=i+1<qs.length?"Weiter":"Ergebnis";
   b.onclick=()=>{i++;ask()};q.append(b);b.focus()})};
 const begin=k=>{qs=k;i=0;sc=[0,0];mine=other=null;ask()};
 if(m!=3){begin(cfg.make());return()=>{}}
 net=code;me=net.role;
 const host=()=>{const k=cfg.make();net.emit("qs",{q:k});begin(k)};
 net.on("qs",x=>{const k=x&&x.q;if(me==1&&Array.isArray(k)&&k.length&&k.length<=12&&k.every(q=>cfg.ok(q)))begin(k)});
 net.on("done",x=>{if(x&&typeof x.s=="number"){other=x.s;result()}});
 net.on("again",()=>{if(me==0)host()});
 net.onclose(()=>say("Die Verbindung wurde getrennt."));
 say(me==0?"Verbunden. Die erste Frage kommt gleich …":"Verbunden. Warte auf die erste Frage …");
 if(me==1)net.emit("again");
 const s=()=>net.stop();
 s.again=()=>me==0?host():net.emit("again");
 return s}}

const IM=MEMES.map(u=>{const i=new Image();i.src=u;return i});
const MS={order:shuffle(MEMES.map((_,i)=>i)),pos:0,left:5};
function meme(st,m,say){
 st.innerHTML=`<div class="mm"><canvas id="cv" width="500" height="500"></canvas><div class="ctl"><button class="btn" id="sw"></button><input class="in" id="t1" maxlength="80" aria-label="Oberer Text" placeholder="Oberer Text"><input class="in" id="t2" maxlength="80" aria-label="Unterer Text" placeholder="Unterer Text"><label>Schriftgröße <input type="range" id="sz" min="24" max="90" value="48"></label><button class="btn" id="sv">Als Bild speichern</button></div></div>`;
 const cv=$("#cv"),x=cv.getContext("2d"),now=()=>IM[MS.order[MS.pos%IM.length]];
 const lines=(s,w)=>{const o=[];let l="";
  for(const wd of s.toUpperCase().split(/\s+/).filter(Boolean)){const t=l?l+" "+wd:wd;if(l&&x.measureText(t).width>w){o.push(l);l=wd}else l=t}
  if(l)o.push(l);return o};
 const draw=()=>{const W=cv.width,H=cv.height,sz=+$("#sz").value*W/500,im=now();
  x.fillStyle="#fff";x.fillRect(0,0,W,H);if(im.complete)x.drawImage(im,0,0,W,H);
  x.font=`800 ${sz}px Impact,"Bricolage Grotesque",sans-serif`;x.textAlign="center";x.textBaseline="top";
  x.lineJoin="round";x.lineWidth=sz/6;x.strokeStyle="#000";x.fillStyle="#fff";
  const put=(ls,y0)=>ls.forEach((l,k)=>{const y=y0+k*sz*1.05;x.strokeText(l,W/2,y);x.fillText(l,W/2,y)});
  const a=lines($("#t1").value,W-24),b=lines($("#t2").value,W-24);
  put(a,12);put(b,H-12-b.length*sz*1.05)};
 const apply=()=>{const im=now();cv.width=im.naturalWidth;cv.height=im.naturalHeight;cv.style.setProperty("--w",cv.width+"px");draw()};
 const load=()=>{const im=now();im.complete?apply():im.addEventListener("load",apply,{once:true})};
 const label=()=>{const b=$("#sw");b.textContent=MS.left?`Anderes Meme (${MS.left} übrig)`:"Keine Wechsel mehr übrig";b.disabled=!MS.left};
 $("#sw").onclick=()=>{if(!MS.left)return;MS.left--;MS.pos++;label();load()};
 ["#t1","#t2","#sz"].forEach(q=>$(q).oninput=draw);
 $("#sv").onclick=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meme.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
 label();load();
 say("Das ist dein Meme. Schreibe Text oben und unten.");
 return()=>{};
}
</script>
